[project]
name = "ulai-voice-studio"
version = "0.1.0"
description = "Voice agent studio built on Ulai Voice Infra"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=12",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "phonenumbers>=8.13",
    # The Ulai Python SDK (ulai-api) is private and installed separately:
    # locally `pip install -e ../../ulai-cloud-python-sdk`, in Docker from GitHub over SSH.
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# FastAPI dependencies are declared as Depends(...) defaults by design.
ignore = ["B008"]
